[package]
name = "sailfish-minify-core"
version = "0.10.3"
authors = ["Abrudan Paul - Andrei <paulandreiabrudan@proton.me>"]
description = "Internal unit-test and benchmark harness for the sailfish-minify proc-macro crate (not published)"
homepage = "https://github.com/pauldotsh/sailfish-minify"
repository = "https://github.com/pauldotsh/sailfish-minify"
keywords = ["minification", "html", "sailfish"]
categories = ["template-engine"]
license = "MIT"
edition = "2021"
publish = false

[lib]
doctest = false

[features]
default = ["minify-components", "native-minifier"]
minify-components = []
native-minifier = ["dep:minify-html"]
# `regex` is used to extract `<% include!(...) %>` paths from template source.
# Off by default: the dependency-free manual parser is faster and keeps the
# dependency tree small. Enable only if you need the regex-based behavior.
regex = ["dep:regex"]

[dependencies]
proc-macro2 = "1.0.101"
syn = { version = "2.0.106", features = ["full"] }
quote = "1.0.40"
regex = { version = "1.11.2", optional = true }
rayon = "1.11.0"
pathdiff = "0.2"
minify-html = { version = "0.15", optional = true }

[dev-dependencies]
tempfile = "3"
criterion = "0.5"

[[test]]
name = "unit_tests"
path = "tests/unit_tests.rs"

[[bench]]
name = "minify_benchmark"
path = "benches/minify_benchmark.rs"
harness = false
